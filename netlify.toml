[build]
  base = "."
  command = "npm run build --workspace=shared && npm run build --workspace=frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# API proxy - forwards /api/* to your Heroku backend
[[redirects]]
  from = "/api/*"
  to = "https://yet-another-retro-tool-api-7044d0490743.herokuapp.com/api/:splat"
  status = 200
  force = true

# SPA fallback - all routes serve index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
