services:
  postgres:
    image: postgres:15-alpine
    container_name: retro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retro_db
      POSTGRES_USER: retro_user
      POSTGRES_PASSWORD: retro_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro_user -d retro_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local